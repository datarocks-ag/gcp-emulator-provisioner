# Dependabot: datarocks convention (https://github.com/datarocks-ag/github-actions/blob/develop/docs/dependabot.md).
# Weekly on Monday, labels `dependencies` + the ecosystem, `chore(deps)` commits. Release-together
# families and then all remaining minor and patch updates are grouped; major and security updates
# arrive as PRs of their own.
#
# Dependabot version updates.
#
# Security updates already worked without this file — they are enabled in the
# repository settings and always target the default branch. This adds *version*
# updates on top, which do need configuration.
#
# Two things here are deliberate and easy to break:
#
#   - There is no `target-branch`. The default branch is already `develop`, so
#     setting it would be redundant, and specifying it stops Dependabot raising
#     security updates for that ecosystem — the opposite of what we want.
#   - The branch name prefix is left at the default, `dependabot/...`, because
#     ci.yaml triggers on `dependabot/**`. Renaming it means Dependabot's pull
#     requests silently stop running CI.
version: 2

updates:
  # Go modules. Minor and patch updates arrive as a single grouped pull request
  # to keep the noise down; majors come individually, since they deserve to be
  # read one at a time.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore(deps)
    groups:
      # Security updates mostly hit indirect dependencies pulled in by
      # testcontainers, the Google Cloud SDKs and the golangci-lint tool (otel,
      # moby, x/crypto). One PR per CVE conflicts on go.sum, so batch them.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # The actions used by ci.yaml and release.yaml. These drift quietly and are
  # the most likely thing to break a pipeline that nobody touched.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: chore(deps)
    ignore:
      # Dependabot proposed a non-existent major "v2201" for this action (#26).
      # `@v2` already floats to the latest v2.x; a real major needs manual review.
      - dependency-name: vladopajic/go-test-coverage
        update-types: [version-update:semver-major]

  # Builder base images in Dockerfile and Dockerfile.token-stub. The final
  # stages are `scratch`, which has nothing to update.
  #
  # Note that a bump here moves the builder's Go version independently of
  # GO_VERSION in the workflows, so the two can drift apart: the images would
  # still build, but on a different toolchain than CI tests with.
    groups:
      # Actions don't pin each other, and nearly every bump is a major (Node
      # runtime), so majors are grouped too. CI exercises them all, so one PR is
      # enough to review.
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Zurich
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
