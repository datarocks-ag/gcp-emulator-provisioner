version: 2

builds:
  - id: gcp-emulator-provisioner
    main: ./cmd/gcp-emulator-provisioner
    binary: gcp-emulator-provisioner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  # The long-lived token stub, released alongside the one-shot provisioner.
  - id: gcp-token-stub
    main: ./cmd/gcp-token-stub
    binary: gcp-token-stub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# One archive per binary, so a stack that only needs the stub does not download
# the provisioner as well.
archives:
  - id: gcp-emulator-provisioner
    ids:
      - gcp-emulator-provisioner
    name_template: "gcp-emulator-provisioner_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

  - id: gcp-token-stub
    ids:
      - gcp-token-stub
    name_template: "gcp-token-stub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  replace_existing_artifacts: true
